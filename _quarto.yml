website:
  title: "HidrAmazônia"
  image: "images/hidramzonia_schme.png"
  description: "Hydrological and ecophysiological controls on Amazon forests responses to drought and flooding"
 
  navbar:
    background: dark

    left:
      - text: Project
        href: project.qmd
      - text: Team
        href: people.qmd
      - text: News
        href: news.qmd
      - text: Publications
        href: publications.qmd            
      - text: Opportunities
        href: opportunities.qmd
      - text: Teaching
        href: teaching.qmd
      - text: Contacts
        href: contact.qmd

    right: 
      - icon: github
        href: https://github.com/HidrAmazonia/HidrAmazonia.github.io
        target: _blank
  
  page-navigation: true
  
  page-footer: 
    left: "[Sylvain Schmitt](http://www.github.com/sylvainschmitt) &copy; <script>document.write(new Date().getFullYear())</script>" 
    center: "Build on [Quarto Academic Website Template](https://github.com/drganghe/quarto-academic-website-template) adapted by [Sylvain Schmitt](https://sylvainschmitt.netlify.app/)"
    right:  
      - icon: github
        href: https://github.com
        target: _blank
      - icon: rss
