project:
  type: website
  output-dir: docs
    
description-meta: "PlantForAdapt – Adapting planted forests with native species for resilient Amazonian territories in the face of global changes"
author-meta: "Géraldine Derroire"

website:
  title: "PlantForAdapt"
  description: "Adapting planted forests with native species for resilient Amazonian territories in the face of global changes"
 
  navbar:
    background: white
    logo: files/images/logo_plantforadapt.png
    logo-alt: "PlantForAdapt logo"
    title: false

    left:
      - text: Project
        menu:
          - text: Context
            href: project.qmd#contexte
          - text: Objectives
            href: project.qmd#obj
          - text: Hypothesis
            href: project.qmd#hyp
          - text: Organisation
            href: project.qmd#orga
          - text: Sites
            href: project.qmd#sites
          - text: Stakeholders
            href: project.qmd#stakeholder
          - text: Impact
            href: project.qmd#impact
      - text: People
        menu:
          - text: Team
            href: people.qmd#team
          - text: Students
            href: people.qmd#students
          - text: Steering committee
            href: people.qmd#committee
      - text: Outputs
        href: outputs.qmd
      - text: News
        href: news.qmd
      - text: Contacts
        href: contact.qmd

    right: 
      - icon: github
        href: https://github.com/PlantForAdapt/PlantForAdapt
        target: _blank
  
  page-navigation: true
  
  page-footer: 
    left: "[Géraldine Derroire](http://www.github.com/GeraldineDerroire) &copy; <script>document.write(new Date().getFullYear())</script>" 
    center: "Build on [Quarto Academic Website Template](https://github.com/drganghe/quarto-academic-website-template) adapted by Géraldine Derroire and Sylvain Schmitt"
    right:  
      - icon: github
        href: https://github.com
        target: _blank
      - icon: rss
        href: posts.xml
        target: _blank  
  
  search:
    location: navbar
    type: textbox
  
  reader-mode: false

  repo-url: https://github.com/PlantForAdapt/PlantForAdapt
  
  open-graph: true
  
  site-url: "https://PlantForAdapt.github.io/"
  
bibliography: references.bib

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    footnotes-hover: true
    code-copy: true
    code-link: true
    code-overflow: wrap
    fig-align: center
    link-external-icon: false
    link-external-newwindow: true
    email-obfuscation: javascript
    link-external-filter: '^(?:http:|https:)\/\/PlantForAdapt\.github\.io'
    include-in-header: "files/includes/_academic.qmd"

